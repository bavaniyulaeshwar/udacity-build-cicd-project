name: Frontend Continuous Deployment

on:
  push:
      branches:
            - master
                paths:
                      - 'starter/frontend/**'
                            - '.github/workflows/frontend-cd.yaml'

                              workflow_dispatch:

                              jobs:
                                lint:
                                    runs-on: ubuntu-latest

                                        steps:
                                              - name: Checkout code
                                                      uses: actions/checkout@v4

                                                            - name: Setup Node.js
                                                                    uses: actions/setup-node@v4
                                                                            with:
                                                                                      node-version: '20'
                                                                                                cache: 'npm'
                                                                                                          cache-dependency-path: starter/frontend/package-lock.json

                                                                                                                - name: Install dependencies
                                                                                                                        working-directory: starter/frontend
                                                                                                                                run: npm ci

                                                                                                                                      - name: Run lint
                                                                                                                                              working-directory: starter/frontend
                                                                                                                                                      run: npm run lint

                                                                                                                                                        test:
                                                                                                                                                            runs-on: ubuntu-latest

                                                                                                                                                                steps:
                                                                                                                                                                      - name: Checkout code
                                                                                                                                                                              uses: actions/checkout@v4

                                                                                                                                                                                    - name: Setup Node.js
                                                                                                                                                                                            uses: actions/setup-node@v4
                                                                                                                                                                                                    with:
                                                                                                                                                                                                              node-version: '20'
                                                                                                                                                                                                                        cache: 'npm'
                                                                                                                                                                                                                                  cache-dependency-path: starter/frontend/package-lock.json

                                                                                                                                                                                                                                        - name: Install dependencies
                                                                                                                                                                                                                                                working-directory: starter/frontend
                                                                                                                                                                                                                                                        run: npm ci

                                                                                                                                                                                                                                                              - name: Run tests
                                                                                                                                                                                                                                                                      working-directory: starter/frontend
                                                                                                                                                                                                                                                                              run: CI=true npm test -- --watchAll=false

                                                                                                                                                                                                                                                                                build-and-deploy:
                                                                                                                                                                                                                                                                                    runs-on: ubuntu-latest
                                                                                                                                                                                                                                                                                        needs:
                                                                                                                                                                                                                                                                                              - lint
                                                                                                                                                                                                                                                                                                    - test

                                                                                                                                                                                                                                                                                                        steps:
                                                                                                                                                                                                                                                                                                              - name: Checkout code
                                                                                                                                                                                                                                                                                                                      uses: actions/checkout@v4

                                                                                                                                                                                                                                                                                                                            - name: Configure AWS credentials
                                                                                                                                                                                                                                                                                                                                    uses: aws-actions/configure-aws-credentials@v4
                                                                                                                                                                                                                                                                                                                                            with:
                                                                                                                                                                                                                                                                                                                                                      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                                                                                                                                                                                                                                                                                                                                                                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                                                                                                                                                                                                                                                                                                                                                                          aws-region: ${{ secrets.AWS_REGION }}

                                                                                                                                                                                                                                                                                                                                                                                - name: Login to Amazon ECR
                                                                                                                                                                                                                                                                                                                                                                                        id: login-ecr
                                                                                                                                                                                                                                                                                                                                                                                                uses: aws-actions/amazon-ecr-login@v2

                                                                                                                                                                                                                                                                                                                                                                                                      - name: Build frontend Docker image
                                                                                                                                                                                                                                                                                                                                                                                                              working-directory: starter/frontend
                                                                                                                                                                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                docker build \
                                                                                                                                                                                                                                                                                                                                                                                                                                            --build-arg REACT_APP_MOVIE_API_URL=${{ secrets.REACT_APP_MOVIE_API_URL }} \
                                                                                                                                                                                                                                                                                                                                                                                                                                                        --tag ${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }} .

                                                                                                                                                                                                                                                                                                                                                                                                                                                              - name: Push frontend image to ECR
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                docker push ${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }}

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - name: Update kubeconfig
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        aws eks update-kubeconfig \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    --region ${{ secrets.AWS_REGION }} \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                --name ${{ secrets.EKS_CLUSTER_NAME }}

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - name: Deploy frontend to EKS
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              run: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        kubectl apply -k starter/frontend/k8s

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  kubectl set image deployment/frontend \
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              frontend=${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }}

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        kubectl rollout status deployment/frontend